<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرعون Ai - مغامرة الأمن السيبراني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/heroicons@2.1.1/24/outline/dist/index.js"></script>

    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            /* إضافة خلفية داكنة ثانوية للجسم */
            background-color: #0F172A; /* Darker than the app container */
        }

        #app-container {
            /* لون الخلفية الرئيسي: أزرق داكن (Dark Slate Blue) */
            background-color: #111827;
            /* إضافة نسيج ورق البردي مع تظليل داكن */
            background-image: linear-gradient(rgba(17, 24, 39, 0.96), rgba(0, 0, 0, 0.98)), url('https://www.transparenttextures.com/patterns/papyrus.png');
            color: #F3EAD3; /* لون كريمي فاتح */
            position: relative;
        }

        /* تحسين بصري للخلفية: تأثير شبكة رقمية خفيفة */
        #app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* خطوط شبكة داكنة جداً */
            background-image: linear-gradient(0deg, transparent 24%, rgba(0, 0, 0, 0.1) 25%, rgba(0, 0, 0, 0.1) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, 0.1) 75%, rgba(0, 0, 0, 0.1) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0, 0, 0, 0.1) 25%, rgba(0, 0, 0, 0.1) 26%, transparent 27%, transparent 74%, rgba(0, 0, 0, 0.1) 75%, rgba(0, 0, 0, 0.1) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            opacity: 0.15;
            z-index: 1;
        }

        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 2; /* فوق تأثير الشبكة */
            position: relative;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* تحسين زر المغامرة (Rich Gold to Amber) */
        .btn-adventure {
            background-image: linear-gradient(to bottom, #FBBF24, #D97706);
            color: #1F2937;
            font-weight: 700;
            border-radius: 12px;
            padding: 12px 24px;
            border: 2px solid #B45309;
            box-shadow: 0 6px 15px rgba(251, 191, 36, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease-out;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .btn-adventure:hover:not(:disabled) {
            background-image: linear-gradient(to bottom, #FCD34D, #FBBF24);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.6), 0 2px 4px rgba(0, 0, 0, 0.4);
            transform: translateY(-3px) scale(1.02);
        }
        .btn-adventure:active:not(:disabled) {
            transform: translateY(1px) scale(0.99);
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .btn-adventure:disabled {
            background-image: linear-gradient(to bottom, #6B7280, #4B5563);
            border-color: #374151;
            color: #D1D5DB;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
            transform: none;
            opacity: 0.6;
            cursor: not-allowed;
            text-shadow: none;
        }

        .btn-back {
            background-color: #374151; /* Darker Gray-Blue */
            color: #D1D5DB;
            border: 1px solid #4B5563;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .btn-back:hover:not(:disabled) {
            background-color: #4B5563;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transform: translateY(-1px);
        }
        .btn-back:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
        }

        .btn-lesson {
            background-color: rgba(255, 255, 255, 0.05);
            border: 2px solid;
            /* استخدام Border Image لدرجة لون ذهبية متدرجة */
            border-image: linear-gradient(to right, #B45309, #FBBF24, #B45309) 1;
            color: #F3EAD3;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
            text-align: right;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2);
            position: relative; /* لإظهار القفل فوق الكل */
        }
        .btn-lesson:hover:not(.locked) {
            background-color: rgba(217, 119, 6, 0.15);
            border-image: linear-gradient(to right, #FBBF24, #FCD34D, #FBBF24) 1;
            transform: scale(1.02);
            box-shadow: 0 6px 18px rgba(217, 119, 6, 0.4);
        }
        .btn-lesson.locked {
            border-image: none;
            border-color: #4B5563;
            color: #6B7280;
            background-color: rgba(0, 0, 0, 0.2);
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-lesson.locked .lesson-lock {
            display: block;
        }
        .lesson-lock {
            display: none;
            position: absolute;
            top: 50%;
            right: 50%;
            transform: translate(50%, -50%);
            color: #6B7280;
        }
        
        #splash-screen h1 {
            font-size: 3.75rem;
        }
        @media (min-width: 768px) {
            #splash-screen h1 {
                font-size: 4.5rem;
            }
        }
        
        /* تحسينات الخطاب التعريفي */
        #intro-chat-screen {
            max-height: 100vh;
            overflow-y: auto;
            padding-bottom: 100px;
        }
        #intro-chat-messages {
            flex-grow: 0;
            min-height: calc(100vh - 120px);
        }
        #intro-chat-actions {
            flex-shrink: 0;
        }

        /* أنماط الفقاعات والأسماء */
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes message-pulse {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.3); }
            70% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        
        .chat-bubble-wrapper {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            position: relative;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease forwards;
            position: relative;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }

        .chat-bubble.pulsing {
            animation: message-pulse 0.6s ease-out 1;
        }

        .chat-speaker-name {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 3px;
            padding: 0 12px;
            opacity: 0.9;
        }

        /* تعديل ألوان أسماء الشخصيات */
        .chat-pharaoh .chat-speaker-name { color: #FBBF24; }
        .chat-ahmed .chat-speaker-name { color: #60A5FA; }
        .chat-rital .chat-speaker-name { color: #4ADE80; }
        .chat-recruit .chat-speaker-name { color: #F3EAD3; }

        .chat-pharaoh, .chat-ahmed, .chat-rital {
            align-items: flex-start;
        }
        .chat-recruit {
            align-items: flex-end;
        }

        /* تعديل ألوان فقاعات الدردشة */
        .chat-pharaoh .chat-bubble {
            background-color: #B45309; /* Dark Amber */
            color: #FFFFFF;
            border-top-left-radius: 4px;
        }
        .chat-ahmed .chat-bubble {
            background-color: #1D4ED8; /* Dark Blue */
            color: #FFFFFF;
            border-top-left-radius: 4px;
        }
        .chat-rital .chat-bubble {
            background-color: #047857; /* Dark Green */
            color: #FFFFFF;
            border-top-left-radius: 4px;
        }
        .chat-recruit .chat-bubble {
            background-color: #4B5563; /* Gray-Blue */
            color: #FFFFFF;
            border-top-right-radius: 4px;
        }
        
        .typing-effect {
            display: inline-block;
            overflow: hidden;
            white-space: pre-wrap;
        }

        /* شريط المتحدث الحالي */
        #current-speaker-bar {
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-bottom: 2px solid;
            transition: all 0.3s ease-out;
            min-height: 80px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #current-speaker-bar p {
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        
        /* شاشة التحميل والبداية */
        #loading-screen p, #splash-screen h1, #splash-screen p {
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.7);
        }
        #loading-screen .animate-pulse {
            animation: pulse-gold 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulse-gold {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(251, 191, 36, 1)); }
        }
        
        /* ألوان الاختبار */
        .quiz-correct {
            background-image: none !important;
            background-color: #10B981 !important;
            border-color: #059669 !important;
            color: white !important;
            opacity: 1 !important;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.6) !important;
            transform: none !important;
        }

        .quiz-incorrect {
            background-image: none !important;
            background-color: #EF4444 !important;
            border-color: #DC2626 !important;
            color: white !important;
            opacity: 1 !important;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.6) !important;
            transform: none !important;
        }
    </style>
</head>
<body class="bg-black overflow-hidden">

    <div id="app-container" class="relative w-screen h-screen overflow-hidden">

        <div id="loading-screen" class="screen active flex-col items-center justify-center w-full h-full">
            <svg class="w-24 h-24 text-yellow-400 animate-pulse" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c.4756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242a3 3 0 0 1-4.242-4.243" />
            </svg>
            <p class="text-xl font-bold mt-4 text-yellow-400">جاري تفعيل بروتوكول الاتصال... الخطر وشيك.</p>
        </div>

        <div id="splash-screen" class="screen flex-col items-center justify-center w-full h-full text-center p-4">
            <svg class="w-32 h-32 text-yellow-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.37-3.371A8.25 8.25 0 0 0 15.362 5.214ZM14.25 10.5a8.983 8.983 0 0 0-3.37-3.371M14.25 10.5a8.983 8.983 0 0 1 3.37-3.371m0 0a8.25 8.25 0 0 0-3.37-3.372m3.37 3.372a8.25 8.25 0 0 1 3.372 3.37M9 12.601a8.983 8.983 0 0 1-3.37 3.371M9 12.601a8.983 8.983 0 0 0-3.37 3.372m0 0a8.25 8.25 0 0 0 3.37 3.37m-3.37-3.37a8.25 8.25 0 0 1-3.372-3.37m3.372 3.37a8.25 8.25 0 0 0 3.37-3.37M9 12.601A8.25 8.25 0 0 0 6.038 7.047" />
            </svg>
            
            <h1 class="font-black text-yellow-400 mt-4" style="text-shadow: 0 0 15px rgba(251, 191, 36, 0.7);">فرعون Ai</h1>
            <p class="text-2xl text-red-400 mt-2 font-bold tracking-widest">مغامرة الأمن السيبراني</p>
            <p class="text-lg text-gray-300 mt-4">نظام الدفاع الأخير عن المملكة الرقمية.</p>
        </div>

        <!-- تم التعديل: إضافة overflow-y-auto للشاشة -->
        <div id="intro-chat-screen" class="screen flex-col w-full overflow-hidden">
            <div id="intro-chat-messages" class="flex-grow flex flex-col space-y-4 p-4 pt-10">
                <!-- الرسائل ستضاف هنا -->
            </div>
            <div id="intro-chat-actions" class="p-4 text-center hidden flex-shrink-0">
                <button id="start-learning-btn" class="btn-adventure text-lg">
                    أنا مستعد! لِتبدأ المهمة
                </button>
            </div>
        </div>

        <div id="path-selection-screen" class="screen flex-col items-center justify-center w-full h-full p-8">
            <h2 class="font-bold mb-8 text-center text-yellow-400 text-3xl md:text-4xl">اختر مسار محارب السايبر</h2>
            <div id="path-grid" class="w-full max-w-md space-y-4">
                <button data-path="beginner" class="path-btn btn-adventure w-full text-2xl">
                    <span class="block">1. مسار الحارس المبتدئ</span>
                    <span class="block text-sm font-normal">(الأساس المتين)</span>
                </button>
                <button data-path="intermediate" class="path-btn btn-adventure w-full text-2xl">
                    <span class="block">2. مسار الخبراء المتوسطين</span>
                    <span class="block text-sm font-normal">(تحليل وتكتيكات)</span>
                </button>
                <button data-path="upperIntermediate" class="path-btn btn-adventure w-full text-2xl">
                    <span class="block">3. مسار فوق المتوسط</span>
                    <span class="block text-sm font-normal">(دفاع وهجوم متقدم)</span>
                </button>
                <button data-path="advanced" class="path-btn btn-adventure w-full text-2xl opacity-50 cursor-not-allowed" disabled>
                    <span class="block">4. مسار المحارب المتقدم</span>
                    <span class="block text-sm font-normal">(قريباً...)</span>
                </button>
            </div>
        </div>

        <div id="lesson-list-screen" class="screen flex-col w-full h-full overflow-hidden">
            <div class="flex-shrink-0 p-4 border-b border-yellow-800 flex justify-between items-center">
                <h2 id="path-title" class="font-bold text-yellow-400 text-center flex-grow text-xl md:text-2xl">مسار المبتدئين: الأساس</h2>
                <button id="back-to-paths-btn" class="btn-adventure btn-back text-sm px-3 py-2">
                    العودة للمسارات
                </button>
            </div>
            <div id="lesson-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 overflow-y-auto flex-grow">
            </div>
        </div>
        
        <div id="lesson-view-screen" class="screen flex-col w-full h-full overflow-hidden">
            <div id="current-speaker-bar" class="flex items-center p-3 px-4 shadow-xl border-yellow-800 flex-shrink-0">
            </div>

            <div id="lesson-dialogue-area" class="flex-grow flex flex-col space-y-2 p-4 overflow-y-auto">
            </div>
            <div class="p-2 text-center text-gray-400 text-sm border-t border-yellow-800 flex-shrink-0">
                <p>اضغط في أي مكان للمتابعة</p>
            </div>
        </div>

        <div id="summary-screen" class="screen flex-col w-full h-full p-6 justify-center overflow-y-auto">
            <h2 class="text-3xl font-bold text-yellow-400 text-center mb-6">ملخص المهمة</h2>
            <div id="summary-content" class="text-lg bg-black/20 p-6 rounded-lg border border-yellow-700 leading-relaxed shadow-xl">
            </div>
            <button id="start-quiz-btn" class="btn-adventure text-lg mt-8 w-full max-w-xs mx-auto">
                بدء الاختبار القصير
            </button>
        </div>

        <div id="quiz-screen" class="screen flex-col w-full h-full p-6 justify-center overflow-y-auto">
            <h2 class="font-bold text-yellow-400 text-center mb-6 text-3xl">اختبار المهمة</h2>
            <div class="w-full max-w-lg mx-auto">
                <p id="quiz-question" class="text-center mb-8 text-xl"></p>
                <div id="quiz-options" class="flex flex-col space-y-4">
                </div>
                <p id="quiz-feedback" class="text-center text-lg mt-6 font-bold"></p>
                <button id="next-question-btn" class="btn-adventure text-lg mt-8 w-full max-w-xs mx-auto hidden">
                    السؤال التالي
                </button>
            </div>
        </div>

    </div>

    <script type="module">
        const database = {
            introChat: [
                { char: 'pharaoh', text: "تنبيه! تم اختراق بروتوكول الأمن السيبراني. النظام يحتاج إلى حارس رقمي فوراً." },
                { char: 'pharaoh', text: "مرحباً بك، أيها المجند. لقد تم اختيارك لمبادرة 'فرعون Ai'. مصير البنية التحتية الرقمية للمملكة معلق على كتفيك." },
                { char: 'ahmed', text: "أنا القائد أحمد. هذا ليس تدريباً عادياً، بل استدعاء عاجل. سأكون مسؤول عملياتك، وأوجهك في هذا الميدان الشائك." },
                { char: 'rital', text: "وأنا المهندسة ريتال. لا تقلق بشأن التعقيدات التقنية، مهمتي هي تبسيط كل شيء لتفهم طبيعة الخطر بسرعة فائقة. نحن فريقك!" },
                { char: 'recruit', text: "أتلقى الأوامر. أنا جاهز لمواجهة التهديد وسأبذل قصارى جهدي!" },
                { char: 'ahmed', text: "جيد. الوقت ينفد. لتبدأ مهمتك الأولى بتقوية الأساسيات. هل أنت مستعد لخطوتك الأولى في عالم الحراسة الرقمية؟" }
            ],
            paths: {
                beginner: {
                    title: "مسار الحارس المبتدئ",
                    description: "الأساس المتين لمواجهة التهديدات الأولية.",
                    lessons: [
                        {
                            title: "1. مقدمة في عالم الأمن السيبراني",
                            storyTitle: "لماذا نحتاج حراساً؟",
                            dialogue: [
                                { char: 'ahmed', text: "المهمة الأولى: فهم ميدان المعركة. يجب أن تعرف ما الذي تحميه وما هي أسلحة العدو. ما هو الأمن السيبراني؟" },
                                { char: 'recruit', text: "أفترض أنه حماية أجهزة الكمبيوتر؟" },
                                { char: 'rital', text: "لتبسيط الأمر، تخيل أن الإنترنت هو هرمك الخاص المليء بالكنوز، مثل صورك، رسائلك، وبياناتك المصرفية. كل هذه كنوز رقمية ثمينة." },
                                { char: 'rital', text: "الأمن السيبراني هو بناء جدران قوية، ووضع حراس (مثلنا!) لحماية هذا الهرم من اللصوص (نسميهم 'المخترقين') الذين يحاولون سرقة كنوزك أو تدمير الجدران." },
                                { char: 'recruit', text: "إذاً، هو درع رقمي شامل لحماية البيانات والموارد؟" },
                                { char: 'ahmed', text: "بالضبط! إنه الدرع الذي يحمي أسرار مملكتنا الرقمية. بدون هذا الدرع، يمكن لأي اختراق أن يسبب كارثة." }
                            ],
                            summary: "الأمن السيبراني هو ببساطة: حماية أجهزتنا (مثل الكمبيوتر والموبايل) ومعلوماتنا (الكنوز الرقمية) من الأشخاص السيئين على الإنترنت. وهو درع المملكة الرقمية.",
                            quiz: [
                                { q: "ما هو 'الأمن السيبراني'؟", options: ["لعبة فيديو جديدة", "حماية كنوزنا الرقمية من اللصوص", "بناء أهرامات حقيقية"], correct: 1 },
                                { q: "من هم 'المخترقون' في سياق الأمن السيبراني؟", options: ["أشخاص طيبون يساعدوننا", "أشخاص سيئون يحاولون سرقة معلوماتنا أو إتلافها", "بناة الأهرام"], correct: 1 }
                            ]
                        },
                        {
                            title: "2. ثالوث الأمن السيبراني (CIA)",
                            storyTitle: "أعمدة الهرم الثلاثة",
                            dialogue: [
                                { char: 'ahmed', text: "مهمتك التالية هي فهم 'أعمدة الهرم الثلاثة' (CIA). هذا هو المبدأ الأساسي لأي حماية رقمية ناجحة. " },

            progress: {
                beginnerUnlockedLesson: 0,
                intermediateUnlockedLesson: -1, /* قفلتها مبدئياً لتبدو كصفحة قادمة */
                upperIntermediateUnlockedLesson: -1,
                advancedUnlockedLesson: -1, 
                scores: {}
            }
        };

        // استخدام localStorage بسيط لحفظ التقدم (يجب استبداله بـ Firestore في تطبيق حقيقي)
        const LOCAL_STORAGE_KEY = 'pharaohAiProgress';

        document.addEventListener('DOMContentLoaded', initApp);

        async function initApp() {
            try {
                // إعدادات المسارات المغلقة مبدئياً
                if (state.progress.intermediateUnlockedLesson === -1) {
                    document.querySelector('[data-path="intermediate"]').disabled = true;
                }
                if (state.progress.upperIntermediateUnlockedLesson === -1) {
                    document.querySelector('[data-path="upperIntermediate"]').disabled = true;
                }
                
                await loadUserData();
                setTimeout(initSplash, 500); 
            } catch (error) {
                console.error("خطأ فادح في تهيئة التطبيق:", error);
                document.getElementById('loading-screen').innerHTML = "<p class='text-red-500'>حدث خطأ في تحميل التطبيق. حاول تحديث الصفحة.</p>";
            }
        }

        async function loadUserData() {
            try {
                const savedData = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (savedData) {
                    const loadedData = JSON.parse(savedData);
                    state.progress = { 
                        beginnerUnlockedLesson: loadedData.beginnerUnlockedLesson || 0,
                        intermediateUnlockedLesson: loadedData.intermediateUnlockedLesson !== undefined ? loadedData.intermediateUnlockedLesson : -1,
                        upperIntermediateUnlockedLesson: loadedData.upperIntermediateUnlockedLesson !== undefined ? loadedData.upperIntermediateUnlockedLesson : -1,
                        advancedUnlockedLesson: loadedData.advancedUnlockedLesson !== undefined ? loadedData.advancedUnlockedLesson : -1,
                        scores: loadedData.scores || {}
                    };
                } else {
                    state.progress = {
                        beginnerUnlockedLesson: 0,
                        intermediateUnlockedLesson: -1,
                        upperIntermediateUnlockedLesson: -1,
                        advancedUnlockedLesson: -1,
                        scores: {}
                    };
                    await saveUserData();
                }

                // تحديث حالة الأزرار بناءً على التقدم المحمل
                updatePathButtonsState();
            } catch (error) {
                console.error("خطأ في تحميل بيانات المستخدم:", error);
                // إعادة تعيين التقدم في حالة الخطأ
                state.progress = {
                    beginnerUnlockedLesson: 0,
                    intermediateUnlockedLesson: -1,
                    upperIntermediateUnlockedLesson: -1,
                    advancedUnlockedLesson: -1,
                    scores: {}
                };
            }
        }

        function updatePathButtonsState() {
            // تفعيل المسارات إذا تم فتحها
            if (state.progress.intermediateUnlockedLesson >= 0) {
                const btn = document.querySelector('[data-path="intermediate"]');
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.querySelector('.text-sm').textContent = '(تحليل وتكتيكات)';
                }
            }
            if (state.progress.upperIntermediateUnlockedLesson >= 0) {
                const btn = document.querySelector('[data-path="upperIntermediate"]');
                if (btn) {
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.querySelector('.text-sm').textContent = '(دفاع وهجوم متقدم)';
                }
            }
        }

        async function saveUserData() {
            try {
                const dataToSave = {
                    beginnerUnlockedLesson: state.progress.beginnerUnlockedLesson,
                    intermediateUnlockedLesson: state.progress.intermediateUnlockedLesson,
                    upperIntermediateUnlockedLesson: state.progress.upperIntermediateUnlockedLesson,
                    advancedUnlockedLesson: state.progress.advancedUnlockedLesson,
                    scores: state.progress.scores
                };
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(dataToSave));
                console.log("تم حفظ التقدم:", dataToSave);
            } catch (error) {
                console.error("خطأ في حفظ بيانات المستخدم:", error);
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            state.currentScreen = screenId.replace('-screen', '');
        }

        function initSplash() {
            showScreen('splash-screen');
            setTimeout(() => {
                startIntro();
            }, 2500); 
        }
        
        document.getElementById('start-learning-btn').addEventListener('click', () => {
            showScreen('path-selection-screen');
        });
        
        document.querySelectorAll('.path-btn').forEach(button => {
            button.addEventListener('click', (e) => {
                const pathId = e.currentTarget.dataset.path;
                if (!e.currentTarget.disabled) {
                    state.currentPathId = pathId;
                    showLessonList(pathId);
                }
            });
        });
        
        document.getElementById('back-to-paths-btn').addEventListener('click', () => {
            showScreen('path-selection-screen');
        });
        
        function typewriter(element, text, onComplete) {
            state.isTyping = true;
            element.innerHTML = '';
            let charIndex = 0;
            const speed = 40; // أسرع قليلاً

            function type() {
                if (charIndex < text.length) {
                    element.innerHTML += text.charAt(charIndex);
                    charIndex++;
                    state.currentTypingTimeout = setTimeout(type, speed);
                } else {
                    state.isTyping = false;
                    if (onComplete) {
                        onComplete();
                    }
                }
            }
            type();
        }
        
        function finishTyping() {
            if (state.currentTypingTimeout) {
                clearTimeout(state.currentTypingTimeout);
            }
            const currentBubble = document.getElementById('lesson-dialogue-area').lastElementChild?.querySelector('.dialogue-text') || 
                                 document.getElementById('intro-chat-messages').lastElementChild?.querySelector('.dialogue-text');
            
            if (currentBubble) {
                const currentText = currentBubble.dataset.fullText;
                if (currentText) {
                    currentBubble.innerHTML = currentText;
                }
            }
            state.isTyping = false;
        }

        function startIntro() {
            showScreen('intro-chat-screen');
            document.getElementById('intro-chat-messages').innerHTML = ''; // تنظيف المحادثة عند البداية
            document.getElementById('intro-chat-actions').classList.add('hidden');
            state.currentDialogueIndex = 0;
            const introScreen = document.getElementById('intro-chat-screen');
            introScreen.scrollTop = 0; 
            startIntroSequence(0); 
        }

        function startIntroSequence(index) {
            if (index < database.introChat.length) {
                const msg = database.introChat[index];
                addChatMessage(msg.char, msg.text, 'intro-chat-messages', () => {
                    startIntroSequence(index + 1);
                });
            } else {
                document.getElementById('intro-chat-actions').classList.remove('hidden');
                const introScreen = document.getElementById('intro-chat-screen');
                introScreen.scrollTo({ top: introScreen.scrollHeight, behavior: 'smooth' });
            }
        }
        
        function getCharacterInfo(char) {
            const iconClass = "w-10 h-10 p-1 rounded-full border-2";
            switch(char) {
                case 'pharaoh':
                    return {
                        name: "فرعون Ai",
                        role: "المُشرف الرقمي",
                        icon: `<svg class="${iconClass} bg-yellow-500 border-yellow-300 text-black/90 shadow-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.37-3.371A8.25 8.25 0 0 0 15.362 5.214Z" /></svg>`,
                        color: 'text-yellow-400',
                        bgColor: 'bg-yellow-900/50',
                        bubbleColor: '#B45309'
                    };
                case 'ahmed':
                    return {
                        name: "القائد أحمد",
                        role: "مسؤول العمليات",
                        icon: `<svg class="${iconClass} bg-blue-600 border-blue-400 text-white shadow-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.83-5.83M11.42 15.17l-4.24-4.24m4.24 4.24L21 21M15.83 3.83l-4.24-4.24m4.24 4.24L21 21" /></svg>`,
                        color: 'text-blue-400',
                        bgColor: 'bg-blue-900/50',
                        bubbleColor: '#1D4ED8'
                    };
                case 'rital':
                    return {
                        name: "المهندسة ريتال",
                        role: "متخصصة التبسيط التقني",
                        icon: `<svg class="${iconClass} bg-green-600 border-green-400 text-white shadow-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m4.5-10.5H5.25A2.25 2.25 0 0 0 3 9v7.5a2.25 2.25 0 0 0 2.25 2.25h13.5A2.25 2.25 0 0 0 21 16.5V9a2.25 2.25 0 0 0-2.25-2.25ZM6.75 12h.008v.008H6.75V12Zm.008 3h.008v.008H6.75V15h.008Z" /></svg>`,
                        color: 'text-green-400',
                        bgColor: 'bg-green-900/50',
                        bubbleColor: '#047857'
                    };
                case 'recruit':
                    return {
                        name: "المجند",
                        role: "الحارس المستجد",
                        icon: `<svg class="${iconClass} bg-gray-500 border-gray-400 text-white shadow-lg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0 .75.75 0 0 1-.416.712A8.914 8.914 0 0 1 12 22a8.914 8.914 0 0 1-7.082-1.17.75.75 0 0 1-.416-.712Z" /></svg>`,
                        color: 'text-gray-300',
                        bgColor: 'bg-gray-800/50',
                        bubbleColor: '#4B5563'
                    };
                default:
                    return { name: "غير معروف", role: "", icon: "", color: 'text-gray-500', bgColor: 'bg-gray-700/50', bubbleColor: '#555' };
            }
        }
        
        function updateSpeakerBar(char) {
            const info = getCharacterInfo(char);
            const speakerBar = document.getElementById('current-speaker-bar');

            if (state.currentScreen === 'intro-chat' || state.currentScreen === 'splash' || state.currentScreen === 'loading') {
                speakerBar.classList.add('hidden');
                return;
            }
            
            speakerBar.classList.remove('hidden');
            speakerBar.className = `flex items-center p-3 px-4 shadow-xl border-b-2 border-yellow-800 ${info.bgColor} ${info.color} speaker-title-bar flex-shrink-0`;
            speakerBar.innerHTML = `
                ${info.icon}
                <div class="mr-3">
                    <p class="text-xl font-bold">${info.name}</p>
                    <p class="text-xs font-light opacity-75">${info.role}</p>
                </div>
            `;
        }

        function addChatMessage(char, text, containerId, onComplete = null) {
            if (containerId === 'lesson-dialogue-area') {
                updateSpeakerBar(char);
            }
            
            const container = document.getElementById(containerId);
            const info = getCharacterInfo(char);
            const isRecruit = (char === 'recruit');

            const wrapper = document.createElement('div');
            wrapper.className = `chat-bubble-wrapper chat-${char}`;

            const speakerNameDiv = document.createElement('div');
            speakerNameDiv.className = `chat-speaker-name ${isRecruit ? 'text-left' : 'text-right'}`; 
            speakerNameDiv.style.alignSelf = isRecruit ? 'flex-end' : 'flex-start';

            speakerNameDiv.innerHTML = `${info.name} <span class="text-xs opacity-60">(${info.role})</span>`;
            wrapper.appendChild(speakerNameDiv);
            
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble chat-${char} pulsing`;
            
            const textElement = document.createElement('div');
            textElement.className = 'typing-effect dialogue-text';
            textElement.dataset.fullText = text; 

            bubble.appendChild(textElement);
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            
            if (containerId === 'intro-chat-messages') {
                const introScreen = document.getElementById('intro-chat-screen');
                introScreen.scrollTo({ top: introScreen.scrollHeight, behavior: 'smooth' });
            } else {
                container.scrollTop = container.scrollHeight; 
            }

            typewriter(textElement, text, onComplete);
            setTimeout(() => bubble.classList.remove('pulsing'), 600);
        }
        
        function showLessonList(pathId) {
            showScreen('lesson-list-screen');
            const pathData = database.paths[pathId];
            if (!pathData) return;

            document.getElementById('path-title').textContent = pathData.title;

            const grid = document.getElementById('lesson-grid');
            grid.innerHTML = '';
            
            const unlockedKey = `${pathId}UnlockedLesson`;
            const unlockedLesson = state.progress[unlockedKey] !== undefined ? state.progress[unlockedKey] : -1; 
            
            pathData.lessons.forEach((lesson, index) => {
                const isLocked = index > (unlockedLesson + 1); 
                const isIncomplete = !lesson.dialogue || lesson.dialogue.length === 0;

                const button = document.createElement('button');
                button.className = `btn-lesson flex flex-col justify-between items-start`;
                if (isLocked || isIncomplete) {
                    button.classList.add('locked');
                } else {
                    button.classList.remove('locked');
                }
                
                const storyText = lesson.storyTitle || "قصة الدرس";

                button.innerHTML = `
                    <div class="flex justify-between w-full items-center mb-2">
                        <span class="text-xs font-light text-yellow-300 opacity-80">${index + 1}. مهمة</span>
                        <svg class="w-8 h-8 text-yellow-400 lesson-lock" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V7.5a4.5 4.5 0 1 0-9 0v3h3m7.5 0h-15m5.25-9.75h4.5a2.25 2.25 0 0 1 2.25 2.25v10.5a2.25 2.25 0 0 1-2.25 2.25h-4.5a2.25 2.25 0 0 1-2.25-2.25v-10.5a2.25 2.25 0 0 1 2.25-2.25Z" />
                        </svg>
                    </div>
                    <h3 class="text-xl md:text-2xl font-bold mb-1 text-right">${lesson.title}</h3>
                    <p class="text-sm text-gray-400 text-right">${storyText}</p>
                `;
                
                if (!isLocked && !isIncomplete) {
                    button.addEventListener('click', () => startLesson(index));
                }
                grid.appendChild(button);
            });
        }
        
        function startLesson(index) {
            const lessons = database.paths[state.currentPathId].lessons;
            if (!lessons[index] || !lessons[index].dialogue || lessons[index].dialogue.length === 0) {
                 console.warn("Attempted to start an incomplete or locked lesson.");
                 return;
            }

            state.currentLessonIndex = index;
            state.currentDialogueIndex = 0;
            showScreen('lesson-view-screen');
            document.getElementById('lesson-dialogue-area').innerHTML = '';
            displayNextLessonMessage();
        }

        function displayNextLessonMessage() {
            const lesson = database.paths[state.currentPathId].lessons[state.currentLessonIndex];
            if (!lesson) return;
            
            if (state.currentDialogueIndex < lesson.dialogue.length) {
                const msg = lesson.dialogue[state.currentDialogueIndex];
                addChatMessage(msg.char, msg.text, 'lesson-dialogue-area');
            } else {
                showSummaryScreen(lesson);
            }
        }
        
        function handleLessonClick() {
            if (state.isTyping) {
                finishTyping(); 
                return;
            }
            
            if (state.currentScreen === 'lesson-view') {
                state.currentDialogueIndex++;
                displayNextLessonMessage();
            }
        }
        document.getElementById('lesson-dialogue-area').addEventListener('click', handleLessonClick);


        function showSummaryScreen(lesson) {
            showScreen('summary-screen');
            document.getElementById('summary-content').innerHTML = `
                <h3 class="text-xl font-bold text-yellow-400 mb-3">${lesson.title}</h3>
                <p>${lesson.summary}</p>
            `;
            document.getElementById('start-quiz-btn').onclick = () => startQuiz(lesson.quiz);
        }

        let currentQuizData = [];

        function startQuiz(quizData) {
            if (!quizData || quizData.length === 0) {
                // If no quiz, auto-unlock next lesson and go back
                unlockNextLesson();
                showLessonList(state.currentPathId);
                return;
            }
            currentQuizData = quizData;
            state.currentQuizQuestion = 0;
            state.quizScore = 0;
            document.getElementById('next-question-btn').classList.add('hidden');
            document.getElementById('quiz-feedback').innerHTML = '';
            showScreen('quiz-screen');
            displayNextQuestion();
        }

        function unlockNextLesson() {
            const unlockedKey = `${state.currentPathId}UnlockedLesson`;
            const currentLessonIndex = state.currentLessonIndex;
            
            if (currentLessonIndex === state.progress[unlockedKey]) {
                state.progress[unlockedKey] = currentLessonIndex + 1;
                saveUserData();
            }
        }

        function displayNextQuestion() {
            if (state.currentQuizQuestion >= currentQuizData.length) {
                const total = currentQuizData.length;
                const score = state.quizScore;
                
                let feedbackText = `أحسنت! أكملت مهمة التدريب.`;
                let feedbackColor = 'text-green-400';
                
                if (score < total) {
                    feedbackText = `لقد حصلت على ${score} من ${total}. عليك مراجعة بعض النقاط.`;
                    feedbackColor = 'text-yellow-400';
                } else if (score === total) {
                    feedbackText = `تهانينا! ${score} من ${total}. نجاح باهر. يمكنك الآن فتح المهمة التالية.`;
                    feedbackColor = 'text-green-400';
                    
                    unlockNextLesson();
                }
                
                document.getElementById('quiz-question').innerHTML = `نتائجك النهائية: ${feedbackText}`;
                document.getElementById('quiz-question').className = `text-2xl text-center mb-8 ${feedbackColor} font-bold`;

                document.getElementById('quiz-options').innerHTML = '';
                document.getElementById('quiz-feedback').innerHTML = '';
                
                const backButton = document.createElement('button');
                backButton.className = 'btn-adventure text-lg mt-8 w-full max-w-xs mx-auto';
                backButton.textContent = 'العودة لقائمة المهام';
                backButton.onclick = () => showLessonList(state.currentPathId);
                document.getElementById('quiz-options').appendChild(backButton);

                return;
            }

            const currentQ = currentQuizData[state.currentQuizQuestion];
            document.getElementById('quiz-question').textContent = currentQ.q;
            document.getElementById('quiz-feedback').textContent = '';
            document.getElementById('next-question-btn').classList.add('hidden');
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            
            currentQ.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'btn-adventure text-lg w-full transition duration-200 ease-in-out';
                btn.textContent = option;
                btn.dataset.index = index;
                btn.onclick = () => checkAnswer(btn, index, currentQ.correct, optionsContainer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedButton, selectedIndex, correctIndex, optionsContainer) {
            const feedback = document.getElementById('quiz-feedback');
            
            document.getElementById('next-question-btn').classList.remove('hidden');

            Array.from(optionsContainer.children).forEach(btn => {
                btn.disabled = true;
                btn.classList.add('opacity-70', 'cursor-default'); 

                const isCorrectOption = parseInt(btn.dataset.index) === correctIndex;
                const isSelectedOption = parseInt(btn.dataset.index) === selectedIndex;
                
                if (isCorrectOption) {
                    btn.classList.add('quiz-correct');
                    btn.textContent += ' (إجابة صحيحة)';
                } else if (isSelectedOption) {
                    btn.classList.add('quiz-incorrect');
                    btn.textContent += ' (إجابتك)';
                }
            });

            if (selectedIndex === correctIndex) {
                state.quizScore++;
                feedback.textContent = 'ممتاز! إجابتك صحيحة.';
                feedback.className = 'text-center text-xl mt-6 font-bold text-green-400';
            } else {
                feedback.textContent = 'خطأ. راجع المبدأ الذي تم شرحه.';
                feedback.className = 'text-center text-xl mt-6 font-bold text-red-400';
            }

            document.getElementById('next-question-btn').onclick = () => {
                state.currentQuizQuestion++;
                displayNextQuestion();
            };
        }

    </script>
    
</body>
</html>
